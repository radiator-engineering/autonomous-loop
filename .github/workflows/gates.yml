# The gates this repo ships are only worth what they catch, and until now nothing ran them except
# whoever remembered to run install.sh before pushing. That is the same defect install.sh refuses
# one level down: a harness nothing invokes is a document.
name: gates

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repo: the job reads the tree, runs the gates, and reports. Say so,
# rather than inheriting whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Source gates
        run: ./install.sh --check

      - name: Bundle gates
        run: ./install.sh --check-bundles
